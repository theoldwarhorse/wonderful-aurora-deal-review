name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend lint, type-check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint
        run: |
          pipx run ruff==0.17.5 check backend
          pipx run ruff==0.17.5 format --check backend
      - name: Type-check
        run: |
          python -m pip install --quiet -r backend/requirements.txt mypy==2.4.1
          python -m mypy backend/app
      - name: Test against Postgres
        run: docker compose run --rm tests

  frontend:
    name: Frontend tests, type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
