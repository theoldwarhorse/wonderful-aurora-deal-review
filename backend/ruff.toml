# Lint and format with:  uvx ruff@0.17.5 check . && uvx ruff@0.17.5 format .   (CI uses the same version)
target-version = "py312"
line-length = 140

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]  # tests are made of asserts and use fixed fake tokens

[lint.flake8-bugbear]
# FastAPI declares request parts as argument defaults.
extend-immutable-calls = ["fastapi.Form", "fastapi.File", "fastapi.Header"]
